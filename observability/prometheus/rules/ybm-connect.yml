groups:
  - name: ybm-connect
    rules:
      - alert: YbmConnectHighErrorRate
        expr: |
          (
            sum(rate(http_requests_total{service="ybm-connect",status=~"5.."}[5m]))
            /
            clamp_min(sum(rate(http_requests_total{service="ybm-connect"}[5m])), 0.001)
          ) > 0.05
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: YBM Connect HTTP error rate is above 5%
          description: More than 5% of HTTP requests have returned 5xx responses for 5 minutes.

      - alert: YbmConnectHighLatency
        expr: |
          histogram_quantile(
            0.95,
            sum by (le) (rate(http_request_duration_seconds{service="ybm-connect"}[5m]))
          ) > 2
        for: 5m
        labels:
          severity: high
        annotations:
          summary: YBM Connect HTTP p95 latency is above 2 seconds
          description: HTTP request p95 latency has exceeded 2 seconds for 5 minutes.

      - alert: YbmConnectDbPoolNearExhaustion
        expr: |
          db_pool_connections_active{service="ybm-connect"}
          /
          clamp_min(db_pool_connections_max{service="ybm-connect"}, 1)
          > 0.9
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: YBM Connect PostgreSQL pool is near exhaustion
          description: Active database connections exceed 90% of the configured maximum.
